<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title></title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #111b21;
        color: #e9edef;
        padding: 20px 16px 16px;
        box-sizing: border-box;
        font-size: 14px;
        line-height: 1.45;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .content {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
      }
      header {
        text-align: center;
        margin-bottom: 14px;
      }
      header img {
        width: 64px;
        height: 64px;
      }
      h1 {
        font-size: 20px;
        font-weight: normal;
        margin: 6px 0 0;
      }
      #version,
      .muted {
        color: #8696a0;
        font-size: 13px;
      }
      #version {
        margin: 2px 0 8px;
      }
      #description {
        margin: 0;
      }
      #disclaimer {
        font-size: 12px;
        color: #8696a0;
        background: #202c33;
        border: 1px solid #2a3942;
        border-radius: 6px;
        padding: 10px 12px;
        margin: 0 0 14px;
      }
      h2 {
        font-size: 13px;
        font-weight: normal;
        color: #8696a0;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 14px 0 4px;
      }
      p {
        margin: 0 0 4px;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
      }
      button.link {
        background: none;
        border: none;
        padding: 0;
        font: inherit;
        color: #53bdeb;
        cursor: pointer;
      }
      button.link:hover {
        text-decoration: underline;
      }
      button:focus-visible {
        outline: 2px solid #8696a0;
        outline-offset: 2px;
      }
      #tech {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 12px;
        margin: 0 0 8px;
        font-size: 13px;
      }
      #tech dt {
        color: #8696a0;
      }
      #tech dd {
        margin: 0;
        font-family: monospace;
        user-select: text;
        word-break: break-all;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
      }
      #update-status {
        flex: 1 1 auto;
        font-size: 12px;
        color: #8696a0;
      }
      button.primary,
      button.secondary {
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 14px;
        cursor: pointer;
      }
      button.primary {
        background: #00a884;
        color: #111b21;
        border: none;
      }
      button.secondary {
        background: none;
        color: #e9edef;
        border: 1px solid #2a3942;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <header>
        <img src="../../build/icon.png" alt="" />
        <h1>TuxChat</h1>
        <p id="version"></p>
        <p id="description"></p>
      </header>

      <p id="disclaimer"></p>

      <p><button class="link" id="license" data-link="license"></button></p>
      <p class="muted">© 2026 Erick Salamanca</p>

      <h2 id="links-heading"></h2>
      <div class="links">
        <button class="link" id="link-repo" data-link="repo"></button>
        <button class="link" id="link-issues" data-link="issues"></button>
        <button class="link" id="link-releases" data-link="releases"></button>
        <button class="link" id="link-website" data-link="website"></button>
      </div>

      <h2 id="credits-heading"></h2>
      <p>
        Pedro Henrique (<button class="link" data-link="pedruhb">@pedruhb</button>),
        <span id="credit-pedruhb"></span>
      </p>

      <h2 id="tech-heading"></h2>
      <dl id="tech"></dl>
      <button class="secondary" id="copy-info"></button>
    </div>

    <div class="actions">
      <button class="secondary" id="check-updates"></button>
      <span id="update-status" role="status"></span>
      <button class="primary" id="close"></button>
    </div>
    <script src="../i18n/renderer-strings.js"></script>
    <script src="dialog.js"></script>
  </body>
</html>
