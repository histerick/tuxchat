<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title></title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #111b21;
        color: #e9edef;
        padding: 16px;
        box-sizing: border-box;
        font-size: 16px;
      }
      h1 {
        font-size: 18px;
        font-weight: normal;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #d1d7db;
        margin: 0 0 14px;
      }
      #current {
        font-size: 13px;
        color: #8696a0;
        margin: 0 0 12px;
      }
      #list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
        max-height: 160px;
        overflow-y: auto;
      }
      .session-row {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #202c33;
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 16px;
        cursor: pointer;
      }
      .session-row input[type='radio'] {
        width: 16px;
        height: 16px;
        accent-color: #00a884;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 8px;
      }
      button {
        background: #202c33;
        border: none;
        border-radius: 6px;
        color: inherit;
        padding: 8px 14px;
        font-size: 16px;
        cursor: pointer;
      }
      button#save {
        background: #00a884;
        color: #111b21;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1 id="heading"></h1>
    <p id="description"></p>
    <p id="current"></p>
    <div id="list"></div>
    <div class="actions">
      <button id="forget"></button>
      <button id="save" disabled></button>
      <button id="close"></button>
    </div>
    <script src="../i18n/renderer-strings.js"></script>
    <script src="settings-dialog.js"></script>
  </body>
</html>
