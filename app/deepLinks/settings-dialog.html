<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Links do WhatsApp</title>
    <style>
      :root {
        --bg: #202c33;
        --card-bg: #202c33;
        --input-bg: #111b21;
        --border: #2a3942;
        --whatsapp-green: #00a884;
        --whatsapp-green-hover: #06cf9c;
        --danger: #f15c6d;
        --danger-hover: #ff6b7d;
        --text-primary: #e9edef;
        --text-secondary: #8696a0;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text-primary);
        font:
          13px system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        user-select: none;
        overflow: hidden;
        border-radius: 12px;
      }
      .modal-card {
        display: flex;
        flex-direction: column;
        height: 100%;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .modal-header {
        padding: 14px 18px 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        -webkit-app-region: drag;
      }
      .modal-title-group {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .modal-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .modal-title-icon {
        color: var(--whatsapp-green);
        display: flex;
        align-items: center;
      }
      .modal-subtitle {
        font-size: 12px;
        color: var(--text-secondary);
        margin: 0;
      }
      .modal-close-btn {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        -webkit-app-region: no-drag;
        transition:
          background-color 0.15s,
          color 0.15s;
      }
      .modal-close-btn:hover {
        background: #2a3942;
        color: var(--text-primary);
      }
      .modal-body {
        padding: 16px 18px 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow: hidden;
      }
      .current-status-box {
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .current-status-icon {
        color: var(--whatsapp-green);
        flex-shrink: 0;
      }
      .current-text {
        font-size: 12px;
        line-height: 1.4;
        color: var(--text-secondary);
        margin: 0;
      }
      .current-text strong {
        color: var(--text-primary);
      }
      .sessions-section-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-primary);
        margin: 2px 0 0;
      }
      #list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 165px;
        overflow-y: auto;
        padding-right: 2px;
      }
      .session-row {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
        transition:
          background-color 0.15s,
          border-color 0.15s;
      }
      .session-row:hover {
        background: #2a3942;
        border-color: #3b4a54;
      }
      .session-row.selected {
        border-color: var(--whatsapp-green);
        background: rgba(0, 168, 132, 0.08);
      }
      .session-row input[type="radio"] {
        width: 16px;
        height: 16px;
        accent-color: var(--whatsapp-green);
        margin: 0;
        cursor: pointer;
      }
      .session-row-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #202c33;
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
      }
      .session-row-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .session-row-avatar .initials {
        font-size: 11px;
        font-weight: 700;
        color: var(--whatsapp-green);
      }
      .session-row-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }
      .hint-text {
        font-size: 11px;
        color: var(--text-secondary);
        margin: 0;
      }
      .modal-footer {
        padding: 12px 18px;
        background: #182229;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .modal-footer-right {
        display: flex;
        gap: 10px;
        margin-left: auto;
      }
      .btn-danger-outline {
        background: transparent;
        color: var(--danger);
        border: 1px solid rgba(241, 92, 109, 0.35);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background-color 0.15s,
          border-color 0.15s;
      }
      .btn-danger-outline:hover:not(:disabled) {
        background: rgba(241, 92, 109, 0.12);
        border-color: var(--danger);
      }
      .btn-danger-outline:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .btn-secondary {
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background-color 0.15s,
          color 0.15s,
          border-color 0.15s;
      }
      .btn-secondary:hover {
        background: #202c33;
        color: var(--text-primary);
        border-color: #3b4a54;
      }
      .btn-primary {
        background: var(--whatsapp-green);
        color: #111b21;
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 168, 132, 0.3);
        transition:
          background-color 0.15s,
          transform 0.1s;
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--whatsapp-green-hover);
        transform: translateY(-1px);
      }
      .btn-primary:disabled {
        opacity: 0.5;
        cursor: default;
        transform: none;
      }
    </style>
  </head>
  <body>
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-group">
          <h2 id="heading" class="modal-title">
            <span class="modal-title-icon">
              <svg
                width="17"
                height="17"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
              >
                <path
                  d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                ></path>
                <path
                  d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                ></path>
              </svg>
            </span>
            Links do WhatsApp
          </h2>
          <p id="description" class="modal-subtitle">
            Defina qual sessão abre links do tipo whatsapp://
          </p>
        </div>
        <button
          type="button"
          id="modal-close-btn"
          class="modal-close-btn"
          aria-label="Fechar"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="current-status-box">
          <svg
            class="current-status-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <p id="current" class="current-text"></p>
        </div>

        <span class="sessions-section-title">Selecionar sessão padrão</span>
        <div id="list"></div>

        <p class="hint-text">
          Se nenhuma sessão estiver salva, o TuxChat perguntará qual sessão
          utilizar toda vez que um link for aberto.
        </p>
      </div>

      <div class="modal-footer">
        <div class="modal-footer-left">
          <button type="button" id="forget" class="btn-danger-outline"></button>
        </div>
        <div class="modal-footer-right">
          <button type="button" id="close" class="btn-secondary"></button>
          <button type="button" id="save" class="btn-primary" disabled></button>
        </div>
      </div>
    </div>

    <script src="../i18n/renderer-strings.js"></script>
    <script src="settings-dialog.js"></script>
  </body>
</html>
