<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title></title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #111b21;
        color: #e9edef;
        padding: 16px;
        box-sizing: border-box;
        font-size: 16px;
      }
      h1 {
        font-size: 18px;
        font-weight: normal;
        margin: 0 0 4px;
      }
      #subheading {
        font-size: 13px;
        color: #8696a0;
        margin: 0 0 16px;
      }
      #notes {
        white-space: pre-wrap;
        font-size: 14px;
        line-height: 1.5;
        background: #202c33;
        border: 1px solid #2a3942;
        border-radius: 6px;
        padding: 12px;
        max-height: 340px;
        overflow-y: auto;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 16px;
      }
      button {
        background: #00a884;
        color: #111b21;
        border: none;
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1 id="heading"></h1>
    <p id="subheading"></p>
    <pre id="notes"></pre>
    <div class="actions">
      <button id="close"></button>
    </div>
    <script src="../i18n/renderer-strings.js"></script>
    <script src="changelog-dialog.js"></script>
  </body>
</html>
