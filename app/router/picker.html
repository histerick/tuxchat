<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Abrir link do WhatsApp</title>
    <style>
      :root {
        --bg: #202c33;
        --card-bg: #202c33;
        --input-bg: #111b21;
        --border: #2a3942;
        --whatsapp-green: #00a884;
        --whatsapp-green-hover: #06cf9c;
        --danger: #f15c6d;
        --danger-hover: #ff6b7d;
        --text-primary: #e9edef;
        --text-secondary: #8696a0;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text-primary);
        font:
          13px system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .modal-card {
        display: flex;
        flex-direction: column;
        height: 100%;
        background: var(--card-bg);
        border: 1px solid var(--border);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      }
      .modal-header {
        padding: 16px 20px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        -webkit-app-region: drag;
      }
      .modal-close-btn {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        padding: 4px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background-color 0.15s,
          color 0.15s;
        -webkit-app-region: no-drag;
      }
      .modal-close-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-primary);
      }
      .modal-title-group {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .modal-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .modal-title-icon {
        color: var(--whatsapp-green);
        display: flex;
        align-items: center;
      }
      .modal-subtitle {
        font-size: 12px;
        color: var(--text-secondary);
        margin: 0;
      }
      .modal-body {
        padding: 14px 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
      }
      .modal-body::-webkit-scrollbar {
        width: 6px;
      }
      .modal-body::-webkit-scrollbar-thumb {
        background: #2a3942;
        border-radius: 3px;
      }
      .message-section {
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: #182229;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .message-header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .message-label {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .auto-send-row {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        user-select: none;
        font-size: 11.5px;
        color: var(--whatsapp-green);
        font-weight: 500;
      }
      .auto-send-row:hover {
        color: var(--whatsapp-green-hover);
      }
      .auto-send-row input[type="checkbox"] {
        accent-color: var(--whatsapp-green);
        width: 14px;
        height: 14px;
        cursor: pointer;
        margin: 0;
      }
      .message-textarea {
        width: 100%;
        min-height: 52px;
        max-height: 85px;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        color: var(--text-primary);
        font: 12.5px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        resize: vertical;
        outline: none;
        box-sizing: border-box;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .message-textarea:focus {
        border-color: var(--whatsapp-green);
        box-shadow: 0 0 0 1px var(--whatsapp-green);
      }
      .message-textarea::placeholder {
        color: var(--text-secondary);
        opacity: 0.65;
      }
      .sessions-section-title {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-top: 2px;
        margin-bottom: -2px;
      }
      .sessions-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .session-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 12px;
        cursor: pointer;
        transition:
          background-color 0.15s,
          border-color 0.15s,
          transform 0.1s;
      }
      .session-row:hover {
        background: #2a3942;
        border-color: var(--whatsapp-green);
        transform: translateY(-1px);
      }
      .session-row:active {
        transform: translateY(0);
      }
      .session-row:focus-visible {
        outline: 2px solid var(--whatsapp-green);
        outline-offset: 1px;
      }
      .session-main-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
        pointer-events: none;
      }
      .session-avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #202c33;
        border: 1.5px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
        font-size: 12px;
        font-weight: 700;
        color: var(--whatsapp-green);
      }
      .session-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .session-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .session-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .session-time-desc {
        font-size: 11px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .session-row-right {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .session-arrow {
        color: var(--text-secondary);
        opacity: 0;
        transform: translateX(-4px);
        transition:
          opacity 0.15s,
          transform 0.15s,
          color 0.15s;
        display: flex;
        align-items: center;
        pointer-events: none;
      }
      .session-row:hover .session-arrow {
        opacity: 1;
        transform: translateX(0);
        color: var(--whatsapp-green);
      }
      .session-row.is-hidden {
        opacity: 0.75;
      }
      .session-row.is-hidden .session-name {
        color: var(--text-secondary);
      }
      .hide-toggle-btn {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        width: 28px;
        height: 28px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition:
          background-color 0.15s,
          color 0.15s;
      }
      .hide-toggle-btn:hover {
        background: #202c33;
        color: var(--whatsapp-green);
      }
      .session-row.is-hidden .hide-toggle-btn:hover {
        color: var(--whatsapp-green);
      }

      /* Collapsible hidden sessions */
      .hidden-section {
        margin-top: 4px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .toggle-hidden-btn {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 500;
        padding: 6px 4px;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition: color 0.15s;
        align-self: flex-start;
      }
      .toggle-hidden-btn:hover {
        color: var(--text-primary);
      }
      .toggle-arrow {
        font-size: 10px;
        transition: transform 0.2s;
      }
      .toggle-hidden-btn.open .toggle-arrow {
        transform: rotate(180deg);
      }
      .hidden-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .remember-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-secondary);
        cursor: pointer;
        user-select: none;
      }
      .remember-row:hover {
        color: var(--text-primary);
      }
      .remember-row input[type="checkbox"] {
        width: 15px;
        height: 15px;
        accent-color: var(--whatsapp-green);
        cursor: pointer;
        margin: 0;
      }
      .modal-footer {
        padding: 12px 20px;
        background: #182229;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .btn-secondary {
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background-color 0.15s,
          color 0.15s,
          border-color 0.15s;
      }
      .btn-secondary:hover {
        background: #202c33;
        color: var(--text-primary);
        border-color: #3b4a54;
      }
      .btn-primary {
        background: var(--whatsapp-green);
        color: #111b21;
        border: none;
        border-radius: 8px;
        padding: 8px 20px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 168, 132, 0.3);
        transition:
          background-color 0.15s,
          transform 0.1s;
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--whatsapp-green-hover);
        transform: translateY(-1px);
      }
      .btn-primary:disabled {
        opacity: 0.45;
        cursor: default;
        transform: none;
      }
    </style>
  </head>
  <body>
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-group">
          <h2 id="heading" class="modal-title">
            <span class="modal-title-icon">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
              >
                <path
                  d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                ></path>
                <path
                  d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                ></path>
              </svg>
            </span>
            Abrir link do WhatsApp
          </h2>
          <p id="subheading" class="modal-subtitle">
            Com qual sessão deseja enviar a mensagem?
          </p>
        </div>
        <button
          type="button"
          id="close-x-btn"
          class="modal-close-btn"
          aria-label="Fechar"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="message-section">
          <div class="message-header-row">
            <label for="message-input" id="message-label" class="message-label">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
              <span>Mensagem:</span>
            </label>
            <label class="auto-send-row">
              <input id="auto-send" type="checkbox" />
              <span id="auto-send-label">Enviar automaticamente</span>
            </label>
          </div>
          <textarea
            id="message-input"
            class="message-textarea"
            rows="3"
            placeholder="Digite ou edite a mensagem..."
            spellcheck="true"
          ></textarea>
        </div>

        <div id="sessions-heading" class="sessions-section-title">
          Enviar com a sessão:
        </div>

        <div id="visible-list" class="sessions-list"></div>

        <div id="hidden-section" class="hidden-section" hidden>
          <button
            type="button"
            id="toggle-hidden-btn"
            class="toggle-hidden-btn"
          >
            <span id="hidden-label">Sessões ocultas (0)</span>
            <span class="toggle-arrow">▼</span>
          </button>
          <div id="hidden-list" class="hidden-list" hidden></div>
        </div>
      </div>

      <div class="modal-footer">
        <label class="remember-row">
          <input id="remember" type="checkbox" />
          <span id="remember-label"
            >Lembrar desta escolha para os próximos links</span
          >
        </label>
        <button type="button" id="cancel" class="btn-secondary">
          Cancelar
        </button>
      </div>
    </div>

    <script src="../i18n/renderer-strings.js"></script>
    <script src="picker.js"></script>
  </body>
</html>
