<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title></title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #111b21;
        color: #e9edef;
        padding: 16px;
        box-sizing: border-box;
        font-size: 16px;
      }
      h1 {
        font-size: 18px;
        font-weight: normal;
        margin: 0 0 12px;
      }
      #list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
        max-height: 180px;
        overflow-y: auto;
      }
      .session-row {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #202c33;
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 16px;
        cursor: pointer;
      }
      .session-row input[type='radio'] {
        width: 16px;
        height: 16px;
        accent-color: #00a884;
      }
      .remember-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #d1d7db;
        margin-bottom: 16px;
      }
      .remember-row input[type='checkbox'] {
        width: 16px;
        height: 16px;
        accent-color: #00a884;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
      }
      button {
        background: #00a884;
        color: #111b21;
        border: none;
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 16px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1 id="heading"></h1>
    <div id="list"></div>
    <label class="remember-row">
      <input id="remember" type="checkbox" />
      <span id="remember-label"></span>
    </label>
    <div class="actions">
      <button id="open" disabled></button>
    </div>
    <script src="../i18n/renderer-strings.js"></script>
    <script src="picker.js"></script>
  </body>
</html>
