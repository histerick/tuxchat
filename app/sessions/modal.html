<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Sessão TuxChat</title>
    <style>
      :root {
        --bg: #202c33;
        --card-bg: #202c33;
        --input-bg: #1d1f1f;
        --border: #2a3942;
        --whatsapp-green: #00a884;
        --whatsapp-green-hover: #06cf9c;
        --danger: #f15c6d;
        --danger-hover: #ff6b7d;
        --text-primary: #e9edef;
        --text-secondary: #8696a0;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text-primary);
        font:
          13px system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        user-select: none;
        overflow: hidden;
        border-radius: 12px;
      }

      .modal-card {
        display: flex;
        flex-direction: column;
        height: 100%;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .modal-header {
        padding: 14px 18px 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        -webkit-app-region: drag;
      }

      .modal-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
        margin: 0 0 2px;
      }

      .modal-subtitle {
        font-size: 12px;
        color: var(--text-secondary);
        margin: 0;
      }

      .modal-close-btn {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        -webkit-app-region: no-drag;
        transition:
          background-color 0.15s,
          color 0.15s;
      }

      .modal-close-btn:hover {
        background: #2a3942;
        color: var(--text-primary);
      }

      .modal-body {
        padding: 14px 18px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow: hidden;
      }

      /* Avatar Section */
      .avatar-section {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .avatar-preview {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: var(--input-bg);
        border: 2px dashed var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        cursor: pointer;
        flex-shrink: 0;
        transition:
          border-radius 0.22s cubic-bezier(0.4, 0, 0.2, 1),
          border-color 0.2s,
          transform 0.15s;
      }

      .avatar-preview:hover {
        border-radius: 18px;
        border-color: var(--whatsapp-green);
        transform: scale(1.03);
      }

      .avatar-preview.has-photo {
        border-style: solid;
        border-color: var(--whatsapp-green);
      }

      .avatar-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .avatar-initials {
        font-size: 24px;
        font-weight: 700;
        color: var(--whatsapp-green);
      }

      .avatar-hover-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        color: #ffffff;
        font-size: 11px;
        font-weight: 600;
        opacity: 0;
        transition: opacity 0.18s;
      }

      .avatar-preview:hover .avatar-hover-overlay {
        opacity: 1;
      }

      .avatar-controls {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .avatar-buttons {
        display: flex;
        gap: 8px;
      }

      .btn-avatar-action {
        background: var(--input-bg);
        color: var(--text-primary);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition:
          background-color 0.15s,
          border-color 0.15s;
      }

      .btn-avatar-action:hover {
        background: #2a3942;
        border-color: #3b4a54;
      }

      .btn-avatar-action.remove {
        color: var(--danger);
      }

      .btn-avatar-action.remove:hover {
        background: rgba(241, 92, 109, 0.12);
        border-color: var(--danger);
      }

      .avatar-hint {
        font-size: 11px;
        color: var(--text-secondary);
      }

      /* Form Field */
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .form-label .required {
        color: var(--whatsapp-green);
      }

      .form-input {
        width: 100%;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-primary);
        padding: 10px 14px;
        font-size: 14px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .form-input:focus {
        border-color: var(--whatsapp-green);
        box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.25);
      }

      .form-input::placeholder {
        color: var(--text-secondary);
        opacity: 0.6;
      }

      .input-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 18px;
      }

      .form-error {
        color: var(--danger);
        font-size: 12px;
      }

      .char-count {
        font-size: 12px;
        color: var(--text-secondary);
        margin-left: auto;
      }

      /* Modal Footer */
      .modal-footer {
        padding: 12px 18px;
        background: #182229;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .modal-footer-right {
        display: flex;
        gap: 10px;
        margin-left: auto;
      }

      .btn-primary {
        background: var(--whatsapp-green);
        color: #1d1f1f;
        border: none;
        border-radius: 8px;
        padding: 9px 18px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 2px 8px rgba(0, 168, 132, 0.3);
        transition:
          background-color 0.15s,
          transform 0.1s,
          box-shadow 0.15s;
      }

      .btn-primary:hover {
        background: var(--whatsapp-green-hover);
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(0, 168, 132, 0.4);
      }

      .btn-primary:disabled {
        opacity: 0.5;
        cursor: default;
        transform: none;
        box-shadow: none;
      }

      .btn-secondary {
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background-color 0.15s,
          color 0.15s,
          border-color 0.15s;
      }

      .btn-secondary:hover {
        background: #202c33;
        color: var(--text-primary);
        border-color: #3b4a54;
      }

      .btn-danger-outline {
        background: transparent;
        color: var(--danger);
        border: 1px solid rgba(241, 92, 109, 0.35);
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition:
          background-color 0.15s,
          border-color 0.15s;
      }

      .btn-danger-outline:hover {
        background: rgba(241, 92, 109, 0.12);
        border-color: var(--danger);
      }
    </style>
  </head>

  <body>
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h2 id="modal-title" class="modal-title">Nova Sessão</h2>
          <p id="modal-subtitle" class="modal-subtitle">
            Personalize sua sessão com nome e foto de perfil.
          </p>
        </div>
        <button
          type="button"
          id="modal-close-btn"
          class="modal-close-btn"
          aria-label="Fechar"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <!-- Avatar picker -->
        <div class="avatar-section">
          <div
            id="modal-avatar-preview"
            class="avatar-preview"
            title="Clique para escolher uma foto"
          >
            <img
              id="modal-avatar-img"
              class="avatar-img"
              alt="Foto da sessão"
              hidden
            />
            <span id="modal-avatar-initials" class="avatar-initials">S</span>
            <div class="avatar-hover-overlay">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
                ></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
              <span>Alterar</span>
            </div>
          </div>
          <input
            type="file"
            id="modal-avatar-input"
            accept="image/png, image/jpeg, image/jpg, image/webp"
            style="display: none"
          />

          <div class="avatar-controls">
            <div class="avatar-buttons">
              <button
                type="button"
                id="modal-choose-photo-btn"
                class="btn-avatar-action"
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
                  ></path>
                  <circle cx="12" cy="13" r="4"></circle>
                </svg>
                <span id="modal-choose-photo-text">Escolher foto</span>
              </button>
              <button
                type="button"
                id="modal-remove-photo-btn"
                class="btn-avatar-action remove"
                hidden
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                <span id="modal-remove-photo-text">Remover</span>
              </button>
            </div>
            <span id="modal-avatar-hint" class="avatar-hint"
              >JPG, PNG ou WebP. Corte quadrado 128x128.</span
            >
          </div>
        </div>

        <!-- Name input -->
        <div class="form-group">
          <label for="modal-name-input" class="form-label">
            <span id="modal-name-label-text">Nome da sessão</span>
            <span class="required">*</span>
          </label>
          <input
            type="text"
            id="modal-name-input"
            class="form-input"
            maxlength="25"
            placeholder="Ex: Trabalho, Pessoal, Vendas..."
            autofocus
          />
          <div class="input-footer">
            <span id="modal-error" class="form-error" hidden></span>
            <span id="modal-char-count" class="char-count">0/25</span>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <div class="modal-footer-left">
          <button
            type="button"
            id="modal-delete-btn"
            class="btn-danger-outline"
            hidden
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="3 6 5 6 21 6"></polyline>
              <path
                d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
              ></path>
            </svg>
            <span id="modal-delete-text">Excluir</span>
          </button>
        </div>
        <div class="modal-footer-right">
          <button type="button" id="modal-cancel-btn" class="btn-secondary">
            Cancelar
          </button>
          <button type="button" id="modal-submit-btn" class="btn-primary">
            Criar sessão
          </button>
        </div>
      </div>
    </div>

    <script src="../i18n/renderer-strings.js"></script>
    <script src="modal.js"></script>
  </body>
</html>
